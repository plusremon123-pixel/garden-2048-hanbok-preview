<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>여자아이 한복 · 걷기 시험</title>
  <style>
    body { margin: 0; background: #f5f1e8; color: #392c25; font-family: system-ui, sans-serif; }
    main { max-width: 540px; margin: auto; padding: 28px 20px 48px; }
    h1 { font-size: 1.35rem; } p { line-height: 1.65; }
    .stage { background: #fff9ec; border-radius: 24px; overflow: hidden; display: grid; place-items: center; }
    .character { width: min(100%, 400px); aspect-ratio: 1; background: url('01-walking-sheet-redraw.png') no-repeat; background-size: 400% 200%; animation: walk 2s steps(1,end) infinite; }
    @keyframes walk { 0% { background-position: 0% 0%; } 12.5% { background-position: 33.3333% 0%; } 25% { background-position: 66.6667% 0%; } 37.5% { background-position: 100% 0%; } 50% { background-position: 0% 100%; } 62.5% { background-position: 33.3333% 100%; } 75% { background-position: 66.6667% 100%; } 87.5% { background-position: 100% 100%; } }
    @media (prefers-reduced-motion: reduce) { .character { animation: none; } }
    a { color: #795330; }
  </style>
</head>
<body><main>
  <h1>첫 번째 여자아이 한복 · 1번 걷기 시험</h1>
  <p>원래 여자아이와 승무 걷기 동작을 참고해 새로 만든 8장짜리 시험 시안이에요. 프레임 전체를 정렬해 2초 동안 반복해요.</p>
  <div class="stage" role="img" aria-label="여자아이 걷기 동작 시험 재생"><div class="character"></div></div>
  <p>발과 옷의 움직임이 자연스러운지 살펴봐 주세요. 원화와 세부 모습이 달라질 수 있는 생성 시안이에요.</p>
  <p><a href="01-walking-sheet-redraw.png">다시 만든 걷기 PNG 시트 보기</a> · <a href="../">한복 메인 미리보기</a></p>
</main></body></html>
