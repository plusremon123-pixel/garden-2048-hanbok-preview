<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>여자아이 한복 · 1번 걷기</title>
<style>
  body{margin:0;background:#f5f1e8;color:#392c25;font-family:system-ui,sans-serif}
  main{max-width:540px;margin:auto;padding:28px 20px 48px} h1{font-size:1.35rem} p{line-height:1.65}
  .stage{background:#fff9ec;border-radius:24px;display:grid;place-items:center;overflow:hidden}
  .stage img{display:block;width:min(100%,360px);height:auto} a{color:#795330}
</style></head><body><main>
<h1>여자아이 한복 · 1번 걷기</h1>
<p>원본 캐릭터를 기준으로 만든 2.5초 반복 동작입니다.</p>
<div class="stage"><img id="motion" src="still.png" width="512" height="768" alt="한복 여자아이 걷기 동작"></div>
<p><a href="01-walking-v3-sheet.png">30프레임 PNG 시트 보기</a> · <a href="../">한복 메인 미리보기</a></p>
</main><script>
const image=document.getElementById('motion'); const preference=matchMedia('(prefers-reduced-motion: reduce)');
function update(){image.src=preference.matches?'still.png':'walking-v3.webp'}
preference.addEventListener('change',update);update();
</script></body></html>
